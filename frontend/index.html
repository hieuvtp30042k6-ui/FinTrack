<!DOCTYPE html>
<html lang="vi" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack - Hệ thống Quản lý Chi tiêu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0F172A",
              "primary-container": "#1E293B",
              "on-primary": "#FFFFFF",
              "surface": "#F8FAFC",
              "surface-container-lowest": "#FFFFFF",
              "surface-container-low": "#F1F5F9",
              "surface-container": "#E2E8F0",
              "surface-container-high": "#CBD5E1",
              "on-surface": "#0F172A",
              "on-surface-variant": "#64748B",
              "outline": "#94A3B8",
              "outline-variant": "#CBD5E1",
              "secondary": "#059669",
              "secondary-container": "#D1FAE5",
              "error": "#E11D48",
              "error-container": "#FFE4E6"
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Plus Jakarta Sans", "sans-serif"]
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-surface text-on-surface font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

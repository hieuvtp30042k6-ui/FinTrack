# ==============================================================================
# PROMETHEUS CONFIGURATION (Mục 15: F09 - Monitoring & Logging)
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # 1. Thu thập metrics từ Backend Expense Tracker (FastAPI /metrics)
  - job_name: "expense-tracker-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          environment: "production"
          service: "backend-api"

  # 2. Tự giám sát chính máy chủ Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 3. Thu thập metrics từ Loki log server
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: "loki-logging"
